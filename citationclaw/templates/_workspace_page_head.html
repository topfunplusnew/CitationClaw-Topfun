<div class="cc-page-head{% if page_head_class %} {{ page_head_class }}{% endif %}">
    <div class="cc-page-head-copy">
        {% if kicker %}
        <p class="cc-page-kicker">{{ kicker }}</p>
        {% endif %}
        <h1 class="cc-page-title">{{ title|safe }}</h1>
        {% if description %}
        <p class="cc-page-description">{{ description }}</p>
        {% endif %}
    </div>
    {% if actions %}
    <div class="cc-page-actions">
        {{ actions|safe }}
    </div>
    {% endif %}
</div>
