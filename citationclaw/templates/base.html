<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spark{% endblock %}</title>
    <link rel="icon" href="/static/assets/logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="cc-app">
    <nav class="agent-navbar cc-navbar">
        <div class="agent-navbar-inner cc-navbar-inner">
            <a href="/" class="agent-brand">
                <div class="agent-brand-icon">
                    <img src="/static/assets/logo.jpg" alt="Spark" class="cc-brand-logo">
                </div>
                <div>
                    <div class="agent-brand-name">Spark</div>
                    <div class="agent-brand-sub">Turning Every Citation into Explainable Impact</div>
                </div>
            </a>
            <div class="agent-nav-links cc-nav-links">
                <a href="/" class="agent-nav-link{% if request.url.path == '/' %} active{% endif %}" data-spa-panel="home">
                    Dashboard
                </a>
                <a href="/config" class="agent-nav-link{% if request.url.path == '/config' %} active{% endif %}" data-spa-panel="config">
                    API Config
                </a>
                <a href="/results" class="agent-nav-link{% if request.url.path == '/results' %} active{% endif %}" data-spa-panel="results">
                    Reports
                </a>
                <a href="/notice" class="agent-nav-link{% if request.url.path == '/notice' %} active{% endif %}">
                    Notice
                </a>
            </div>
            <div class="cc-navbar-tools">
                <div class="cc-navbar-search">
                    <i class="bi bi-search"></i>
                    <input type="search" placeholder="Search analysis...">
                </div>
                <a href="/" class="cc-navbar-cta" data-spa-panel="home">New Analysis</a>
            </div>
        </div>
    </nav>

    <div class="agent-page-content cc-shell">
        {% block content %}{% endblock %}
    </div>

    <div id="cc-toast-container" class="cc-toast-container" aria-live="polite" aria-atomic="true"></div>

    <footer class="agent-footer">
        <small>Spark &nbsp;·&nbsp; 上海交通大学 VisionXLab@RethinkLab</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
